# 直接验证检索与作答：默认重排器原样返回，不请求重排模型。
dataset:
  source: ../data/raw/初赛规则集rules1.json
  dataset_name: preliminary
  index_root: ../data/indexes
  overwrite: false
  unit_builder: rule
  tokenizer: jieba

retrieval:
  retrievers:
    - name: bm25
      params:
        top_k: 30
  fusion:
    name: rrf
    params:
      k: 60
      top_k: 60
  reranker:
    name: bce
    params:
      model_path: models/bce-reranker-base_v1
      batch_size: 32
